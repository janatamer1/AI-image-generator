<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Profile - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <nav class="navbar scrolled" id="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="logo-text">AI <span class="gradient-text">ImageGen</span></a>
      <ul class="navbar-links">
        <li><a href="/pages/user-dashboard/index.html" class="nav-link">Dashboard</a></li>
        <li><a href="/pages/user-images/index.html" class="nav-link">My Images</a></li>
        <li><a href="/pages/user-profile/index.html" class="nav-link active">Profile</a></li>
      </ul>
      <div class="navbar-actions">
        <span class="user-badge" id="userBadge">User</span>
        <button class="btn btn-ghost" onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="container">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">My Profile</h1>
          <p class="dashboard-subtitle">Manage your account information and security.</p>
        </div>
      </div>

      <!-- Profile Info Card -->
      <div class="dashboard-card profile-card">
        <div class="profile-avatar" id="profileAvatar">U</div>
        <div class="profile-info">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" class="form-input" id="profileName">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="profileEmail">
          </div>
          <div class="form-group">
            <label class="form-label">Role</label>
            <input type="text" class="form-input" id="profileRole" readonly>
          </div>
          <div class="form-group">
            <label class="form-label">Member Since</label>
            <input type="text" class="form-input" id="profileDate" readonly>
          </div>
          <div class="form-success" id="profileSuccess" style="display:none;">Profile updated successfully.</div>
          <div class="form-error" id="profileError" style="display:none;"></div>
          <button class="btn btn-primary" onclick="saveProfile()">Save Changes</button>
        </div>
      </div>

      <!-- Change Password Card -->
      <div class="dashboard-card profile-card">
        <h2 class="card-title">Change Password</h2>
        <div class="profile-info">
          <div class="form-group">
            <label class="form-label">Current Password</label>
            <input type="password" class="form-input" id="currentPassword" placeholder="Enter your current password">
          </div>
          <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" class="form-input" id="newPassword" placeholder="At least 6 characters">
          </div>
          <div class="form-group">
            <label class="form-label">Confirm New Password</label>
            <input type="password" class="form-input" id="confirmPassword" placeholder="Re-enter new password">
          </div>
          <div class="form-success" id="passwordSuccess" style="display:none;">Password changed successfully.</div>
          <div class="form-error" id="passwordError" style="display:none;"></div>
          <button class="btn btn-primary" onclick="changePassword()">Update Password</button>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="/shared/navbar.js"></script>
  <script type="module" src="script.js"></script>
</body>

</html>
