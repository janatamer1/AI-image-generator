<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Images - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar scrolled" id="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="logo-text">AI <span class="gradient-text">ImageGen</span></a>
      <ul class="navbar-links">
        <li><a href="/pages/user-dashboard/index.html" class="nav-link">Dashboard</a></li>
        <li><a href="/pages/user-images/index.html" class="nav-link active">My Images</a></li>
        <li><a href="/pages/user-profile/index.html" class="nav-link">Profile</a></li>
      </ul>
      <div class="navbar-actions">
        <span class="user-badge" id="userBadge">User</span>
        <button class="btn btn-ghost" onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="container">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">My Images</h1>
          <p class="dashboard-subtitle">View and download all your previously generated images.</p>
        </div>
      </div>

      <div class="dashboard-card">
        <div class="history-grid" id="historyGrid">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);opacity:0.4;">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
            </svg>
            <p>No images yet. Start generating from your dashboard!</p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="/shared/navbar.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
