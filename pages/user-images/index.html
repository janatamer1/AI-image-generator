<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Images - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar scrolled" id="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="logo-text">AI <span class="gradient-text">ImageGen</span></a>
      <ul class="navbar-links">
        <li><a href="/pages/user-dashboard/index.html" class="nav-link">Studio</a></li>
        <li><a href="/pages/user-images/index.html" class="nav-link active">My Images</a></li>
        <li><a href="/pages/user-profile/index.html" class="nav-link">Profile</a></li>
        <li><a href="/pages/user-stats/index.html" class="nav-link">Stats</a></li>
      </ul>
      <div class="navbar-actions">
        <span class="user-badge" id="userBadge">User</span>
        <button class="btn btn-ghost" onclick="logout()">Log Out</button>
      </div>
    </div>
  </nav>

  <main class="dashboard-main">
    <div class="container">
      <div class="dashboard-header">
        <div>
          <h1 class="dashboard-title">My Images</h1>
          <p class="dashboard-subtitle">All your AI-generated images in one place.</p>
        </div>
        <a href="/pages/user-dashboard/index.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Generate New
        </a>
      </div>

      <div class="images-stats" id="imagesStats">
        <div class="img-stat-card">
          <span class="img-stat-value" id="totalImagesCount">0</span>
          <span class="img-stat-label">Total Images</span>
        </div>
        <div class="img-stat-card">
          <span class="img-stat-value" id="thisMonthCount">0</span>
          <span class="img-stat-label">This Month</span>
        </div>
        <div class="img-stat-card">
          <span class="img-stat-value" id="favoritesCount">0</span>
          <span class="img-stat-label">Favorites</span>
        </div>
      </div>

      <div class="dashboard-card">
        <div class="images-toolbar">
          <div class="images-tabs">
            <button class="images-tab active" id="tab-all" onclick="switchTab('all')">All Images</button>
            <button class="images-tab" id="tab-favorites" onclick="switchTab('favorites')">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" style="display:inline;vertical-align:middle;margin-right:4px;"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
              Favorites
            </button>
          </div>
          <div class="search-bar-inline" id="searchBarWrap">
            <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
            <input type="text" class="form-input search-input" id="imageSearchInput" placeholder="Search by prompt..." oninput="filterImages()">
          </div>
        </div>
        <div class="history-grid" id="historyGrid">
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="color:var(--text-muted);opacity:0.3;">
              <rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/>
            </svg>
            <p>No images yet. <a href="/pages/user-dashboard/index.html" style="color:var(--accent-purple);">Start generating!</a></p>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Image Modal -->
  <div class="modal-overlay" id="imageModal" onclick="closeImageModal(event)">
    <div class="image-modal-content">
      <button class="modal-close" onclick="closeImageModal()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <img src="" alt="" id="modalImage" class="modal-full-img">
      <div class="modal-img-info">
        <p id="modalPrompt"></p>
        <div class="modal-img-actions">
          <button class="btn btn-primary btn-sm" onclick="regenerateImage()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-4"/></svg>
            Regenerate
          </button>
          <button class="btn btn-ghost btn-sm" onclick="downloadModalImage()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="/shared/navbar.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
