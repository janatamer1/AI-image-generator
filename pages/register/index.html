<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="register-page">
    <div class="register-bg-effects">
      <div class="register-orb register-orb-1"></div>
      <div class="register-orb register-orb-2"></div>
    </div>

    <div class="register-card">
      <a href="/index.html" class="logo-text register-logo">AI <span class="gradient-text">ImageGen</span></a>
      <h1 class="register-title">Create an Account</h1>
      <p class="register-subtitle">Sign up to start generating images from text.</p>

      <form onsubmit="event.preventDefault(); handleRegister();">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" class="form-input" id="registerName" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="registerEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="registerPassword" placeholder="Min 6 characters" required minlength="6">
        </div>
        <div class="form-group">
          <label class="form-label">Account Type</label>
          <div class="role-select">
            <label class="role-option">
              <input type="radio" name="role" value="user" checked>
              <span class="role-option-card">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <span class="role-option-title">User</span>
                <span class="role-option-desc">Generate & download images</span>
              </span>
            </label>
            <label class="role-option">
              <input type="radio" name="role" value="admin">
              <span class="role-option-card">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span class="role-option-title">Admin</span>
                <span class="role-option-desc">Manage users & platform</span>
              </span>
            </label>
          </div>
        </div>
        <div class="form-error" id="registerError" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-full">Sign Up</button>
      </form>

      <p class="register-footer">Already have an account? <a href="/pages/login/index.html">Log In</a></p>
    </div>
  </div>

  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
