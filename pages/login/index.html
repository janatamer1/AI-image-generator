<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-bg-effects">
      <div class="auth-orb auth-orb-1"></div>
      <div class="auth-orb auth-orb-2"></div>
    </div>
    <div class="auth-card">
      <a href="/index.html" class="logo-text auth-logo">AI <span class="gradient-text">ImageGen</span></a>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Log in to your account and continue creating.</p>
      <form onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required autocomplete="email">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-with-toggle">
            <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" class="input-toggle-btn" onclick="togglePwd('loginPassword', this)" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>
        <div class="form-error" id="loginError" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-full">Log In</button>
      </form>
      <p class="auth-footer">Don't have an account? <a href="/pages/register/index.html">Sign Up Free</a></p>
    </div>
  </div>
  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
