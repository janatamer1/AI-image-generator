<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-bg-effects">
      <div class="login-orb login-orb-1"></div>
      <div class="login-orb login-orb-2"></div>
    </div>

    <div class="login-card">
      <a href="/index.html" class="logo-text login-logo">AI <span class="gradient-text">ImageGen</span></a>
      <h1 class="login-title">Welcome Back</h1>
      <p class="login-subtitle">Log in to your account to continue creating.</p>

      <form onsubmit="event.preventDefault(); handleLogin();">
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" class="form-input" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" class="form-input" id="loginPassword" placeholder="Enter your password" required>
        </div>
        <div class="form-group checkbox-group">
          <input type="checkbox" id="togglePassword" onclick="togglePasswordVisibility()">
          <label for="togglePassword" class="form-label-checkbox">Show Password</label>
        </div>
        <div class="form-error" id="loginError" style="display:none;"></div>
        <button type="submit" class="btn btn-primary btn-full">Log In</button>
      </form>

      <p class="login-footer">Don't have an account? <a href="/pages/register/index.html">Sign Up</a></p>
    </div>
  </div>

  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
