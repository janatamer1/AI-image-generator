<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Studio - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="studio-body">

  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <a href="/index.html" class="logo-text sidebar-logo">AI <span class="gradient-text">ImageGen</span></a>
      <button class="new-chat-btn" onclick="startNewChat()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        New Chat
      </button>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section-label">Navigation</div>
      <a href="/pages/user-dashboard/index.html" class="sidebar-link active">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        Studio
      </a>
      <a href="/pages/user-images/index.html" class="sidebar-link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        My Images
      </a>
      <a href="/pages/user-profile/index.html" class="sidebar-link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        Profile
      </a>
      <a href="/pages/pricing/index.html" class="sidebar-link">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
        Upgrade Plan
      </a>
    </nav>

    <div class="sidebar-history" id="sidebarHistory">
      <div class="sidebar-section-label">Recent Chats</div>
      <div id="chatHistoryList">
        <p class="sidebar-empty">No chats yet</p>
      </div>
    </div>

    <div class="sidebar-footer">
      <div class="sidebar-user" id="sidebarUser">
        <div class="sidebar-avatar" id="sidebarAvatar">U</div>
        <div class="sidebar-user-info">
          <span class="sidebar-user-name" id="sidebarUserName">User</span>
          <span class="sidebar-user-plan" id="sidebarUserPlan">Free Plan</span>
        </div>
      </div>
      <button class="sidebar-logout-btn" onclick="logout()" title="Log Out">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      </button>
    </div>
  </aside>

  <!-- Mobile Sidebar Toggle -->
  <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>

  <!-- Main Content -->
  <main class="studio-main" id="studioMain">

    <!-- Welcome Screen -->
    <div class="welcome-screen" id="welcomeScreen">
      <div class="welcome-content">
        <div class="welcome-icon">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </div>
        <h1 class="welcome-title">What will you create today?</h1>
        <p class="welcome-subtitle">Describe any image you can imagine and watch it come to life.</p>
        <div class="welcome-suggestions">
          <button class="welcome-suggestion" onclick="fillStudioPrompt('A lone astronaut standing on the surface of Mars at sunset')">
            <span class="ws-emoji">🚀</span>
            <span>Astronaut on Mars at sunset</span>
          </button>
          <button class="welcome-suggestion" onclick="fillStudioPrompt('A cozy coffee shop on a rainy day, warm lighting, bokeh')">
            <span class="ws-emoji">☕</span>
            <span>Cozy coffee shop, rainy day</span>
          </button>
          <button class="welcome-suggestion" onclick="fillStudioPrompt('Majestic wolf howling at the full moon, dramatic landscape')">
            <span class="ws-emoji">🐺</span>
            <span>Wolf howling at the moon</span>
          </button>
          <button class="welcome-suggestion" onclick="fillStudioPrompt('Neon-lit cyberpunk city street with rain reflections at night')">
            <span class="ws-emoji">🌆</span>
            <span>Cyberpunk city at night</span>
          </button>
        </div>
      </div>
    </div>

    <!-- Chat Area -->
    <div class="chat-area" id="chatArea" style="display:none;">
      <div class="chat-messages" id="chatMessages"></div>
    </div>

    <!-- Input Area -->
    <div class="studio-input-area">
      <div class="studio-input-wrapper">
        <textarea
          id="studioPrompt"
          class="studio-textarea"
          placeholder="Describe the image you want to generate..."
          rows="1"
          onkeydown="handleStudioKey(event)"
          oninput="autoResizeTextarea(this)"
        ></textarea>
        <button class="studio-send-btn" id="studioSendBtn" onclick="sendStudioMessage()">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
        </button>
      </div>
      <p class="studio-input-hint">Press <kbd>Enter</kbd> to generate · <kbd>Shift+Enter</kbd> for new line</p>
    </div>
  </main>

  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="/shared/navbar.js"></script>
  <script type="module" src="/shared/imagegen.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
