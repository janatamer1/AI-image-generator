<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Explore - AI ImageGen</title>
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <link rel="stylesheet" href="/shared/styles.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="navbar scrolled" id="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="logo-text">AI <span class="gradient-text">ImageGen</span></a>
      <ul class="navbar-links">
        <li><a href="/index.html" class="nav-link">Home</a></li>
        <li><a href="/pages/explore/index.html" class="nav-link active">Explore</a></li>
        <li><a href="/pages/pricing/index.html" class="nav-link">Pricing</a></li>
      </ul>
      <div class="navbar-actions" id="exploreAuthActions">
        <a href="/pages/login/index.html" class="btn btn-ghost">Log In</a>
        <a href="/pages/register/index.html" class="btn btn-primary">Get Started</a>
      </div>
    </div>
  </nav>

  <main class="explore-main">
    <div class="container">
      <div class="explore-header">
        <div>
          <p class="section-eyebrow">Community</p>
          <h1 class="explore-title">Explore <span class="gradient-text">AI Creations</span></h1>
          <p class="explore-subtitle">Browse images generated by the AI ImageGen community.</p>
        </div>
        <a href="/pages/user-dashboard/index.html" class="btn btn-primary">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
          Create Your Own
        </a>
      </div>

      <div class="explore-stats" id="exploreStats">
        <div class="explore-stat">
          <span class="explore-stat-value" id="statImages">0</span>
          <span class="explore-stat-label">Images Created</span>
        </div>
        <div class="explore-stat-divider"></div>
        <div class="explore-stat">
          <span class="explore-stat-value" id="statCreators">0</span>
          <span class="explore-stat-label">Creators</span>
        </div>
        <div class="explore-stat-divider"></div>
        <div class="explore-stat">
          <span class="explore-stat-value" id="statToday">0</span>
          <span class="explore-stat-label">Generated Today</span>
        </div>
      </div>

      <div class="explore-toolbar">
        <div class="search-bar-inline">
          <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" class="form-input search-input" id="exploreSearch" placeholder="Search prompts..." oninput="filterExplore()">
        </div>
        <div class="explore-sort-group">
          <select class="form-input explore-select" id="exploreSort" onchange="filterExplore()">
            <option value="newest">Newest First</option>
            <option value="oldest">Oldest First</option>
          </select>
        </div>
        <div class="explore-count" id="exploreCount">0 images</div>
      </div>

      <div class="explore-grid" id="exploreGrid">
        <div class="explore-empty">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" style="opacity:0.2;"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
          <h3>No images yet</h3>
          <p>Be the first to create something amazing.</p>
          <a href="/pages/register/index.html" class="btn btn-primary">Start Creating</a>
        </div>
      </div>
    </div>
  </main>

  <!-- Image Modal -->
  <div class="modal-overlay" id="exploreModal" onclick="closeExploreModal(event)">
    <div class="explore-modal-content">
      <button class="modal-close" onclick="closeExploreModal()">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
      <img src="" alt="" id="exploreModalImg" class="explore-modal-img">
      <div class="explore-modal-info">
        <p class="explore-modal-prompt" id="exploreModalPrompt"></p>
        <div class="explore-modal-meta">
          <div class="explore-modal-user" id="exploreModalUser"></div>
          <span id="exploreModalDate"></span>
        </div>
        <div class="explore-modal-actions">
          <button class="btn btn-primary btn-sm" onclick="tryPrompt()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L21 12l-5.813-1.912a2 2 0 0 1-1.275-1.275L12 3Z"/></svg>
            Try This Prompt
          </button>
          <button class="btn btn-ghost btn-sm" onclick="downloadExploreModal()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Download
          </button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="/shared/store.js"></script>
  <script type="module" src="/shared/navbar.js"></script>
  <script type="module" src="script.js"></script>
</body>
</html>
